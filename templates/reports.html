<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;background:#f2f5fa;padding:18px}.box{background:white;padding:20px;border-radius:12px;margin:12px auto;max-width:900px}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}</style></head><body><div class="box"><h2>Reports & Analytics</h2><p>Total applications: <b>{{total}}</b></p><h3>Status summary</h3><table><tr><th>Status</th><th>Count</th></tr>{% for status,count in by_status %}<tr><td>{{status}}</td><td>{{count}}</td></tr>{% endfor %}</table><h3>Staff workload</h3><table><tr><th>Staff</th><th>Assigned applications</th></tr>{% for name,count in by_staff %}<tr><td>{{name}}</td><td>{{count}}</td></tr>{% endfor %}</table><p><a href="/">Back to dashboard</a></p></div></body></html>
