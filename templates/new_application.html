<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;background:#f4f7fb;padding:15px}.card{max-width:600px;background:white;padding:22px;border-radius:12px;margin:auto}input,select{width:100%;padding:12px;margin:8px 0 15px;box-sizing:border-box}.btn{padding:11px;background:#1459a6;color:white;border:0;border-radius:6px}</style></head><body><form class="card" method="post"><h2>New Loan Application</h2>{% for m in get_flashed_messages() %}<p>{{m}}</p>{% endfor %}<label>Applicant name</label><input name="name" required><label>CNIC</label><input name="cnic" placeholder="XXXXX-XXXXXXX-X" required><label>Status</label><select name="status"><option>Draft</option><option>Pending</option><option>Completed</option></select><button class="btn">Create</button> <a href="/">Back</a><p>Original full form will be opened separately after record creation.</p></form></body></html>
