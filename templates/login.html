<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;background:#eef3f9;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:white;padding:28px;border-radius:14px;width:min(92%,360px);box-shadow:0 5px 20px #0001}img{width:90px;display:block;margin:auto}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border-radius:7px}input{border:1px solid #ccd5df}button{background:#164d8d;color:white;border:0}</style></head><body><form class="card" method="post"><img src="/static/tooba-logo.jpg"><h2>Tooba Foundation</h2><p>Cloud Loan Management</p>{% for m in get_flashed_messages() %}<p>{{m}}</p>{% endfor %}<input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Login</button></form></body></html>
