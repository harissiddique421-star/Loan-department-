{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}
<div class="login"><form class="card" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <img src="{{ url_for('static', filename='tooba-logo.svg') }}" alt="Tooba Foundation">
  <h2>Tooba Foundation</h2><p class="muted">Loan Department — staff login</p>
  <input name="username" placeholder="Username" autocomplete="username" required autofocus>
  <label></label>
  <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <p><button class="btn" style="width:100%">Login</button></p>
</form></div>
{% endblock %}
