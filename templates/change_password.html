{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block content %}
<form class="card" method="post" style="max-width:420px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <h1>Apna password badlein</h1>
  <label>Purana password</label><input type="password" name="current" required>
  <label>Naya password (8+ characters)</label><input type="password" name="new" minlength="8" required>
  <label>Naya password dobara</label><input type="password" name="confirm" minlength="8" required>
  <p><button class="btn">Save</button> <a href="{{ url_for('dashboard') }}">Cancel</a></p>
</form>
{% endblock %}
