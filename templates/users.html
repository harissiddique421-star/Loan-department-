<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;padding:15px;background:#f3f6fb}.box{background:white;padding:20px;border-radius:12px;max-width:900px;margin:auto}input,select{padding:10px;margin:5px}.btn{background:#1459a6;color:white;padding:10px;border:0}</style></head><body><div class="box"><h2>User Management (Admin)</h2>{% for m in get_flashed_messages() %}<p>{{m}}</p>{% endfor %}<form method="post"><input name="username" placeholder="Username" required><input name="password" placeholder="Password (12+ chars)" required><select name="role"><option>Staff</option><option>Admin</option></select><button class="btn">Add user</button></form><h3>Users</h3><ul>{% for u in users %}<li>{{u.username}} — {{u.role}} — {{'Active' if u.active else 'Disabled'}} {% if u.id!=current_user.id %}<form style="display:inline" method="post" action="/admin/users/{{u.id}}/toggle"><button>{{'Disable' if u.active else 'Enable'}}</button></form>{% endif %}</li>{% endfor %}</ul><a href="/">Dashboard</a></div></body></html>
